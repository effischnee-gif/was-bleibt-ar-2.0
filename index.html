<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Was bleibt – Augmented Reality</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    #intro {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(88vw, 520px);
      box-sizing: border-box;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(0,0,0,.78);
      color: #fff;
      text-align: center;
      line-height: 1.35;
      font-size: 15px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #intro strong {
      display: block;
      margin-bottom: 5px;
      font-size: 17px;
    }

    #status {
      position: fixed;
      z-index: 21;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(0,0,0,.62);
      color: #fff;
      font-size: 13px;
      opacity: .95;
    }

    .hidden { display: none !important; }

    a-scene {
      position: fixed !important;
      inset: 0;
    }
  </style>
</head>

<body>
  <div id="status">Kamera wird vorbereitet …</div>

  <div id="intro">
    <strong>Was bleibt</strong>
    Richte die Kamera auf das Foto der Mülltüte.
    Sobald es erkannt wird, erscheint die Skulptur in 3-D.
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      maxTrack: 1;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets>
      <a-asset-item id="bagModel" src="./Muelltuete_AR_Artivive.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!--
        The model is deliberately placed slightly in front of the image target.
        The rotation animation is handled by A-Frame, so the GLB itself does
        not need an embedded animation.
      -->
      <a-gltf-model
        id="bag"
        src="#bagModel"
        position="0 0 0.12"
        rotation="0 0 0"
        scale="0.42 0.42 0.42"
        animation__spin="
          property: rotation;
          from: 0 0 0;
          to: 0 360 0;
          dur: 12000;
          easing: linear;
          loop: true;
        "
      ></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");
    const intro = document.getElementById("intro");
    const target = document.getElementById("target");
    const bag = document.getElementById("bag");

    document.addEventListener("DOMContentLoaded", () => {
      target.addEventListener("targetFound", () => {
        status.textContent = "3-D-Skulptur erkannt";
        setTimeout(() => status.classList.add("hidden"), 1200);
      });

      target.addEventListener("targetLost", () => {
        status.textContent = "Foto wieder ins Bild nehmen";
        status.classList.remove("hidden");
      });

      bag.addEventListener("model-loaded", () => {
        // The model is loaded. Nothing else is required.
      });

      bag.addEventListener("model-error", () => {
        status.textContent = "3-D-Modell konnte nicht geladen werden.";
      });

      setTimeout(() => {
        if (status.textContent.includes("vorbereitet")) {
          status.textContent = "Richte die Kamera auf das Foto";
        }
      }, 3000);
    });
  </script>
</body>
</html>
